name: Deploy → Production (maboximmo.fr)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Upload sur Hostinger — Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement FTP vers public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: maboximmo.fr
          username: u630423897.maboximmo.fr
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public_html/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/uploads/**
            **/tcpdf_cache/**
            **/config/smtp_local.php
            **/config/ubiflow_credentials.local.php
            **/db_config.php
