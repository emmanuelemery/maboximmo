name: Deploy → Production (maboximmo.fr)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload sur Hostinger — Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Écrit le SHA du commit dans git_version.txt
        run: echo "${{ github.sha }}" > public_html/git_version.txt

      - name: Déploiement FTP vers public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.maboximmo.fr
          port: 21
          protocol: ftp
          username: u630423897.maboximmo
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public_html/
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-prod-v4-20260420
          log-level: verbose
          exclude: |
            **/.git/**
            **/.gitignore
            **/.gitattributes
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/uploads/**
            **/tcpdf_cache/**
            **/config/smtp_local.php
            **/config/ubiflow_credentials.local.php
            **/db_config.php
